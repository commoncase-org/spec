min_version = "2024.9.5"

[tools]
python = "3.12"
uv = "latest"
bun = "latest"
"npm:markdownlint-cli2" = "latest"

[env]
# Automatic virtualenv activation (created on first `mise install`/`mise run`)
_.python.venv = { path = ".venv", create = true }

[tasks.build]
description = "Mechanically build SPEC.md from spec/SPEC.template.md using Knap"
run = "scripts/build-spec"

[tasks.validate]
description = "Validate conformance vectors against rendering rules and verify data registries"
depends = ["build"]
run = "scripts/validate"

[tasks.lint]
description = "Lint markdown files against line length (col 72) and formatting rules"
run = "markdownlint-cli2 '**/*.md'"

[tasks.create-decision]
description = "Scaffold a new decision record from decisions/0000-template.md (usage: mise run create-decision -- <Title>)"
run = "scripts/create-decision"
